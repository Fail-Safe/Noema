# .goreleaser.yaml — release automation for Noema.
#
# Triggered by the `release.yml` GitHub Actions workflow on any `v*` tag
# pushed to `main`. GoReleaser cross-compiles the binary for every
# supported OS/arch, produces archives + checksums, and publishes a
# GitHub Release populated from commit messages.
#
# Local testing (no publish):
#   goreleaser release --snapshot --clean --skip=publish
#
# Cut a real release from a clean main checkout:
#   git tag v0.3.0 && git push origin v0.3.0
# (the GitHub Actions workflow takes it from there)
#
# Note: v0.1.x and v0.2.x tags exist in git history from early
# development but were never published as downloadable releases —
# v0.3.0 is the first tag with pre-built binaries attached.
#
# Why CGO_ENABLED=0 across every target: Noema's only native-code
# dependency is modernc.org/sqlite, a pure-Go translation of C SQLite.
# Disabling CGo produces a fully static binary on every platform, with
# no surprise libc linkage and no cross-compilation toolchain needed —
# this is the single biggest reason GoReleaser is a good fit for this
# project specifically.
version: 2

project_name: noema

before:
  hooks:
    - go mod tidy
    # Bundle the Hermes memory provider plugin as a release asset.
    - tar -czf noema-hermes-plugin.tar.gz -C plugins hermes

builds:
  - id: noema
    binary: noema
    main: ./cmd/noema
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # ldflags inject build metadata into internal/cli at link time.
    # The Makefile only injects Version; GoReleaser additionally
    # populates Commit and Date so `noema version` shows the full
    # fingerprint on any binary downloaded from the Releases page.
    #
    # CommitDate (not Date) is used so re-cutting a tag produces a
    # bit-identical archive — Date is the build clock, CommitDate is
    # the tag's commit timestamp.
    ldflags:
      - -s -w
      - -X github.com/Fail-Safe/Noema/internal/cli.Version={{.Version}}
      - -X github.com/Fail-Safe/Noema/internal/cli.Commit={{.Commit}}
      - -X github.com/Fail-Safe/Noema/internal/cli.Date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: noema
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Only repo-root docs. AGENT.md is generated per-cortex by
    # `noema init` at runtime, so it does not exist at build time.
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{.ShortCommit}}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other changes
      order: 999

release:
  draft: false
  # prerelease: auto lets GoReleaser mark v0.x.y-rc.N, -beta, -alpha as
  # prereleases automatically. Clean v0.x.y tags become full releases.
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Tag}}"
  header: |
    ## Noema {{.Tag}}

    Pre-built binaries for macOS, Linux, and Windows (amd64 + arm64).
    Verify downloads against `checksums.txt`.

    **Noema is pre-1.0 — expect breaking changes between minor releases
    until v1.0. Cortex data on disk is forward-compatible via
    non-destructive migrations; on-disk `cortex.md` version bumps that
    require a manual step ship with an explicit `noema migrate` command.**
  extra_files:
    - glob: ./noema-hermes-plugin.tar.gz
  footer: |
    ---
    **Install:** see [README — Installation](https://github.com/Fail-Safe/Noema#installation).
    **First run:** `noema init --name my-cortex`

# Homebrew publishing — dual strategy: formula + cask.
#
# Both blocks target the same tap repo (Fail-Safe/homebrew-tap) and the
# same bearer token (HOMEBREW_TAP_TOKEN in the Noema repo's Actions
# secrets). The two blocks write to different subdirectories of the tap:
# Formula/noema.rb for `brews:`, Casks/noema.rb for `homebrew_casks:`.
#
# Known warning during build: GoReleaser logs "artifact already present
# in the list name=noema.rb — this might cause errors when publishing"
# because its internal artifact tracker is keyed on basename and both
# blocks emit `noema.rb`. This is a false positive for the formula+cask
# dual-publish pattern: the publish pipes filter by artifact TYPE, not
# NAME (brew.go:128 uses `artifact.ByType(artifact.BrewFormula)`,
# cask.go:128 uses `artifact.ByType(artifact.BrewCask)`), and brew.go
# tags the formula with `Type: BrewFormula` while cask.go tags the cask
# with `Type: BrewCask`. Each publish pipe picks up exactly its own
# artifact; nothing is dropped. The warning is cosmetic.
#
# Why both:
#
#   * `brews:` (Formula) is the cross-platform path. It generates a
#     formula covering darwin amd64/arm64 + linux amd64/arm64, so both
#     macOS Homebrew and Linuxbrew users can run
#     `brew install Fail-Safe/noema/noema` and get a working binary.
#     This is the primary UX path and the only one Linux users can use.
#
#   * `homebrew_casks:` is GoReleaser's current-recommended path (brews:
#     was deprecated in v2.10). Casks are strictly macOS-only, so this
#     adds a secondary `brew install --cask Fail-Safe/noema/noema` path
#     for macOS users who prefer the cask ecosystem. It does NOT replace
#     the formula path — it augments it.
#
# Precedence on macOS: when a tap contains both a formula and a cask of
# the same name, `brew install Fail-Safe/noema/noema` (without --cask)
# resolves the formula first. macOS users get the formula by default;
# typing `--cask` opts into the cask path explicitly.
#
# When a future GoReleaser major removes `brews:` entirely, Linux users
# will need an alternative (Linuxbrew cask support if it lands, or the
# GitHub Release tarball from `curl | tar`). Revisit at that point —
# no action required until the deprecation actually becomes a removal.
brews:
  - name: noema
    repository:
      owner: Fail-Safe
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/Fail-Safe/Noema"
    description: "The intentional memory layer for your AI agents"
    license: "MIT"
    # Skip pushing the formula on prerelease tags (v0.3.1-rc1, -beta,
    # -alpha). Matches `release.prerelease: auto` above so the tap only
    # gets stable releases — prereleases stay on the GitHub Releases
    # page only.
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "brews: update {{ .ProjectName }} to {{ .Tag }}"
    test: |
      system "#{bin}/noema", "version"
    install: |
      bin.install "noema"

homebrew_casks:
  - name: noema
    binaries:
      - noema
    repository:
      owner: Fail-Safe
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/Fail-Safe/Noema"
    description: "The intentional memory layer for your AI agents"
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "casks: update {{ .ProjectName }} to {{ .Tag }}"
    # Noema binaries are unsigned (pre-1.0, solo project, no Apple
    # Developer account). Gatekeeper's quarantine bit would block
    # first-run launches on recent macOS. The xattr hook below is
    # GoReleaser's documented workaround for unsigned cask binaries.
    #
    # This is a known-fragile bypass: Apple has reserved the right to
    # disable it in future macOS versions without notice. If that
    # happens, macOS cask users can always fall back to the formula
    # path (brew install without --cask), which doesn't trigger
    # quarantine because it fetches via curl rather than the
    # browser-downloaded archive flow.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/noema"]
          end
