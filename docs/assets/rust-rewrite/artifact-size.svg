<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Noema release artifact size comparison</title>
  <desc id="desc">The Go release binary is 14.2 MiB and the Rust release binary is 18.1 MiB. Rust adds 3.9 MiB, or 27.8 percent.</desc>
  <style>
    text { fill: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 24px; font-weight: 700; text-anchor: middle; }
    .subtitle { fill: #4b5563; font-size: 14px; text-anchor: middle; }
    .category { font-size: 15px; font-weight: 700; text-anchor: end; }
    .value { font-size: 14px; font-weight: 700; }
    .tick { fill: #6b7280; font-size: 11px; text-anchor: middle; }
    .axis-label, .note { fill: #4b5563; font-size: 12px; text-anchor: middle; }
    .grid { stroke: #d1d5db; stroke-width: 1; }
    .baseline { fill: #94a3b8; }
    .regression { fill: #ee7733; }
  </style>
  <rect width="1000" height="430" fill="#ffffff"/>
  <text class="title" x="500" y="36">Rust adds 3.9 MiB to the release artifact (+27.8%)</text>
  <text class="subtitle" x="500" y="61">A real but modest distribution cost; both remain single local binaries</text>

  <g aria-hidden="true">
    <line class="grid" x1="210" y1="100" x2="210" y2="320"/>
    <line class="grid" x1="365" y1="100" x2="365" y2="320"/>
    <line class="grid" x1="520" y1="100" x2="520" y2="320"/>
    <line class="grid" x1="675" y1="100" x2="675" y2="320"/>
    <line class="grid" x1="830" y1="100" x2="830" y2="320"/>
  </g>
  <text class="category" x="190" y="166">Go</text>
  <rect class="baseline" x="210" y="130" width="440" height="54" rx="3"/>
  <text class="value" x="665" y="164">14.2 MiB</text>
  <text class="category" x="190" y="266">Rust</text>
  <rect class="regression" x="210" y="230" width="561" height="54" rx="3"/>
  <text class="value" x="786" y="264">18.1 MiB</text>

  <text class="tick" x="210" y="343">0</text>
  <text class="tick" x="365" y="343">5</text>
  <text class="tick" x="520" y="343">10</text>
  <text class="tick" x="675" y="343">15</text>
  <text class="tick" x="830" y="343">20</text>
  <text class="axis-label" x="520" y="370">Release binary size (MiB)</text>
  <text class="note" x="500" y="408">Gray is the current Go baseline; orange marks the Rust size increase.</text>
</svg>
