<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Noema Rust and Go workload comparison</title>
  <desc id="desc">Rust is faster in all ten measured workloads. Rust also uses less peak memory in seven workloads, is effectively equal in one, and uses more memory in the two broad single-process scans. Positive bars point toward Rust better; negative bars point toward Go better.</desc>
  <style>
    text { fill: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 14px; }
    .panel-title { font-size: 19px; font-weight: 700; }
    .direction { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-anchor: middle; }
    .category { font-size: 13px; text-anchor: end; }
    .tick { fill: #6b7280; font-size: 11px; text-anchor: middle; }
    .axis-label { fill: #4b5563; font-size: 12px; text-anchor: middle; }
    .value { font-size: 12px; font-weight: 700; }
    .note { fill: #4b5563; font-size: 12px; text-anchor: middle; }
    .grid { stroke: #d1d5db; stroke-width: 1; }
    .zero { stroke: #4b5563; stroke-width: 1.6; }
    .favorable { fill: #4477aa; }
    .regression { fill: #ee7733; }
    .neutral { fill: #6b7280; }
  </style>

  <rect width="1500" height="820" fill="#ffffff"/>
  <text class="title" x="750" y="34" text-anchor="middle">Rust is faster throughout; broad serial scans use more memory</text>
  <text class="subtitle" x="750" y="59" text-anchor="middle">Each bar states the percentage difference from Go. Bars pointing right favor Rust; bars pointing left favor Go.</text>

  <text class="panel-title" x="550" y="94" text-anchor="middle">Throughput</text>
  <text class="panel-title" x="1210" y="94" text-anchor="middle">Peak memory</text>

  <rect x="300" y="126" width="270" height="550" fill="#fff7ed"/>
  <rect x="570" y="126" width="230" height="550" fill="#eff6ff"/>
  <rect x="960" y="126" width="270" height="550" fill="#fff7ed"/>
  <rect x="1230" y="126" width="230" height="550" fill="#eff6ff"/>

  <text class="direction" x="435" y="116" fill="#ee7733">GO BETTER</text>
  <text class="direction" x="685" y="116" fill="#4477aa">RUST BETTER</text>
  <text class="direction" x="1095" y="116" fill="#ee7733">GO BETTER</text>
  <text class="direction" x="1345" y="116" fill="#4477aa">RUST BETTER</text>

  <g aria-hidden="true">
    <line class="grid" x1="360" y1="126" x2="360" y2="676"/>
    <line class="grid" x1="465" y1="126" x2="465" y2="676"/>
    <line class="zero" x1="570" y1="126" x2="570" y2="676"/>
    <line class="grid" x1="675" y1="126" x2="675" y2="676"/>
    <line class="grid" x1="780" y1="126" x2="780" y2="676"/>
    <line class="grid" x1="1020" y1="126" x2="1020" y2="676"/>
    <line class="grid" x1="1125" y1="126" x2="1125" y2="676"/>
    <line class="zero" x1="1230" y1="126" x2="1230" y2="676"/>
    <line class="grid" x1="1335" y1="126" x2="1335" y2="676"/>
    <line class="grid" x1="1440" y1="126" x2="1440" y2="676"/>
  </g>

  <g aria-label="Workload names">
    <text class="category" x="285" y="161">10k  Serial broad</text>
    <text class="category" x="285" y="216">10k  Serial selective</text>
    <text class="category" x="285" y="271">10k  Four-client broad</text>
    <text class="category" x="285" y="326">10k  Four-client selective</text>
    <text class="category" x="285" y="381">10k  Mixed read/write</text>
    <text class="category" x="285" y="436">100k  Serial broad</text>
    <text class="category" x="285" y="491">100k  Serial selective</text>
    <text class="category" x="285" y="546">100k  Four-client broad</text>
    <text class="category" x="285" y="601">100k  Four-client selective</text>
    <text class="category" x="285" y="656">100k  Mixed read/write</text>
  </g>

  <g aria-label="Throughput difference from Go">
    <rect class="favorable" x="570" y="140" width="103" height="30" rx="2"/><text class="value" x="681" y="160">49% faster</text>
    <rect class="favorable" x="570" y="195" width="94" height="30" rx="2"/><text class="value" x="672" y="215">45% faster</text>
    <rect class="favorable" x="570" y="250" width="29" height="30" rx="2"/><text class="value" x="607" y="270">14% faster</text>
    <rect class="favorable" x="570" y="305" width="32" height="30" rx="2"/><text class="value" x="610" y="325">15% faster</text>
    <rect class="favorable" x="570" y="360" width="55" height="30" rx="2"/><text class="value" x="633" y="380">26% faster</text>
    <rect class="favorable" x="570" y="415" width="190" height="30" rx="2"/><text class="value" x="768" y="435">90% faster</text>
    <rect class="favorable" x="570" y="470" width="96" height="30" rx="2"/><text class="value" x="674" y="490">46% faster</text>
    <rect class="favorable" x="570" y="525" width="116" height="30" rx="2"/><text class="value" x="694" y="545">55% faster</text>
    <rect class="favorable" x="570" y="580" width="109" height="30" rx="2"/><text class="value" x="687" y="600">52% faster</text>
    <rect class="favorable" x="570" y="635" width="87" height="30" rx="2"/><text class="value" x="665" y="655">41% faster</text>
  </g>

  <g aria-label="Peak memory difference from Go">
    <rect class="regression" x="1175" y="140" width="55" height="30" rx="2"/><text class="value" x="1167" y="160" text-anchor="end">26% more</text>
    <rect class="favorable" x="1230" y="195" width="62" height="30" rx="2"/><text class="value" x="1300" y="215">29% less</text>
    <rect class="favorable" x="1230" y="250" width="9" height="30" rx="2"/><text class="value" x="1247" y="270">4% less</text>
    <rect class="favorable" x="1230" y="305" width="36" height="30" rx="2"/><text class="value" x="1274" y="325">17% less</text>
    <rect class="favorable" x="1230" y="360" width="46" height="30" rx="2"/><text class="value" x="1284" y="380">22% less</text>
    <rect class="regression" x="988" y="415" width="242" height="30" rx="2"/><text class="value" x="980" y="435" text-anchor="end">115% more</text>
    <rect class="favorable" x="1230" y="470" width="116" height="30" rx="2"/><text class="value" x="1354" y="490">55% less</text>
    <rect class="neutral" x="1228" y="525" width="2" height="30" rx="1"/><text class="value" x="1239" y="545">about equal</text>
    <rect class="favorable" x="1230" y="580" width="81" height="30" rx="2"/><text class="value" x="1319" y="600">39% less</text>
    <rect class="favorable" x="1230" y="635" width="86" height="30" rx="2"/><text class="value" x="1324" y="655">41% less</text>
  </g>

  <g aria-hidden="true">
    <text class="tick" x="360" y="699">100%</text><text class="tick" x="465" y="699">50%</text><text class="tick" x="570" y="699">same</text><text class="tick" x="675" y="699">50%</text><text class="tick" x="780" y="699">100%</text>
    <text class="tick" x="1020" y="699">100%</text><text class="tick" x="1125" y="699">50%</text><text class="tick" x="1230" y="699">same</text><text class="tick" x="1335" y="699">50%</text><text class="tick" x="1440" y="699">100%</text>
  </g>
  <text class="axis-label" x="550" y="728">Difference in operations per second</text>
  <text class="axis-label" x="1210" y="728">Difference in peak sampled RSS</text>

  <text class="note" x="750" y="774">Blue bars are improvements; orange bars are regressions. Standard durability profile on the same benchmark corpus.</text>
</svg>
