<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">Noema blind-review quality comparison</title>
  <desc id="desc">Go and Rust blind-review scores differed by 1.25 percentage points in the small exact-artifact evaluation and 0.42 points in the frontier evaluation. Both achieved perfect decision accuracy and near-identical retention.</desc>
  <style>
    text { fill: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 24px; font-weight: 700; text-anchor: middle; }
    .subtitle { fill: #4b5563; font-size: 14px; text-anchor: middle; }
    .panel-title { font-size: 17px; font-weight: 700; text-anchor: middle; }
    .category { font-size: 14px; font-weight: 700; text-anchor: end; }
    .score { fill: #ffffff; font-size: 14px; font-weight: 700; text-anchor: end; }
    .gap { font-size: 13px; font-weight: 700; text-anchor: middle; }
    .detail, .note { fill: #4b5563; font-size: 12px; text-anchor: middle; }
    .card { fill: #f8fafc; stroke: #d1d5db; stroke-width: 1; }
    .track { fill: #e5e7eb; }
    .baseline { fill: #94a3b8; }
    .favorable { fill: #4477aa; }
  </style>
  <rect width="1100" height="480" fill="#ffffff"/>
  <text class="title" x="550" y="36">Blind-review quality remains within 1.25 points</text>
  <text class="subtitle" x="550" y="61">Equal decision accuracy and near-identical retention support bounded parity</text>

  <rect class="card" x="55" y="96" width="475" height="290" rx="10"/>
  <text class="panel-title" x="292.5" y="128">Small exact-artifact</text>
  <text class="category" x="145" y="188">Go</text><rect class="track" x="165" y="157" width="320" height="42" rx="4"/><rect class="baseline" x="165" y="157" width="315" height="42" rx="4"/><text class="score" x="470" y="184">98.5%</text>
  <text class="category" x="145" y="248">Rust</text><rect class="track" x="165" y="217" width="320" height="42" rx="4"/><rect class="favorable" x="165" y="217" width="311" height="42" rx="4"/><text class="score" x="466" y="244">97.3%</text>
  <text class="gap" x="292.5" y="300">1.25-point score gap</text>
  <text class="detail" x="292.5" y="328">48/48 decisions correct in both</text>
  <text class="detail" x="292.5" y="351">203/204 retention in both</text>

  <rect class="card" x="570" y="96" width="475" height="290" rx="10"/>
  <text class="panel-title" x="807.5" y="128">Frontier</text>
  <text class="category" x="660" y="188">Go</text><rect class="track" x="680" y="157" width="320" height="42" rx="4"/><rect class="baseline" x="680" y="157" width="319" height="42" rx="4"/><text class="score" x="989" y="184">99.6%</text>
  <text class="category" x="660" y="248">Rust</text><rect class="track" x="680" y="217" width="320" height="42" rx="4"/><rect class="favorable" x="680" y="217" width="317" height="42" rx="4"/><text class="score" x="987" y="244">99.2%</text>
  <text class="gap" x="807.5" y="300">0.42-point score gap</text>
  <text class="detail" x="807.5" y="328">24/24 decisions correct in both</text>
  <text class="detail" x="807.5" y="351">102/102 retention in both</text>

  <text class="note" x="550" y="430">Scores are shares of each evaluation's maximum blind-review score.</text>
  <text class="note" x="550" y="454">The evidence supports parity, not a language-runtime quality advantage.</text>
</svg>
