<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Noema durability profile performance at 10,000 traces</title>
  <desc id="desc">Three charts compare current Go, like-for-like Rust standard, and the Rust-only strong durability option. Rust standard is faster than current Go. Rust strong adds recovery guarantees unavailable in Go at a substantial write-performance cost.</desc>
  <style>
    text { fill: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { fill: #4b5563; font-size: 14px; }
    .panel-title { font-size: 18px; font-weight: 700; }
    .axis-label { fill: #4b5563; font-size: 12px; }
    .tick { fill: #6b7280; font-size: 11px; }
    .category { font-size: 12px; font-weight: 600; text-anchor: middle; }
    .value { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .value-inverse { fill: #ffffff; font-size: 12px; font-weight: 700; text-anchor: middle; }
    .grid { stroke: #d1d5db; stroke-width: 1; }
    .axis { stroke: #374151; stroke-width: 1.5; }
    .go { fill: #4477aa; }
    .standard { fill: #228833; }
    .strong { fill: #aa3377; }
    .legend { font-size: 13px; }
    .note { fill: #4b5563; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .option-label { fill: #aa3377; font-size: 9px; font-weight: 700; text-anchor: middle; }
    .separator { stroke: #6b7280; stroke-width: 1; stroke-dasharray: 4 4; }
  </style>

  <rect width="1200" height="520" fill="#ffffff"/>
  <text class="title" x="600" y="34" text-anchor="middle">Like-for-like default performance plus Rust's opt-in strong mode</text>
  <text class="subtitle" x="600" y="58" text-anchor="middle">10,000-trace mutation campaign; lower is better except throughput</text>

  <!-- Seed time -->
  <g aria-label="Seed time in seconds">
    <text class="panel-title" x="200" y="88" text-anchor="middle">Seed time</text>
    <rect x="260" y="100" width="85" height="290" fill="#fdf2f8"/>
    <line class="grid" x1="50" y1="390" x2="350" y2="390"/>
    <line class="grid" x1="50" y1="332" x2="350" y2="332"/>
    <line class="grid" x1="50" y1="274" x2="350" y2="274"/>
    <line class="grid" x1="50" y1="216" x2="350" y2="216"/>
    <line class="grid" x1="50" y1="158" x2="350" y2="158"/>
    <line class="grid" x1="50" y1="100" x2="350" y2="100"/>
    <line class="axis" x1="50" y1="100" x2="50" y2="390"/>
    <line class="axis" x1="50" y1="390" x2="350" y2="390"/>
    <line class="separator" x1="250" y1="100" x2="250" y2="390"/>
    <text class="tick" x="42" y="394" text-anchor="end">0</text>
    <text class="tick" x="42" y="336" text-anchor="end">20</text>
    <text class="tick" x="42" y="278" text-anchor="end">40</text>
    <text class="tick" x="42" y="220" text-anchor="end">60</text>
    <text class="tick" x="42" y="162" text-anchor="end">80</text>
    <text class="tick" x="42" y="104" text-anchor="end">100</text>
    <text class="axis-label" x="16" y="245" text-anchor="middle" transform="rotate(-90 16 245)">Seconds</text>
    <text class="option-label" x="302.5" y="112">RUST-ONLY OPTION</text>
    <rect class="go" x="95" y="370.9" width="50" height="19.1"/>
    <rect class="standard" x="160" y="381" width="50" height="9"/>
    <rect class="strong" x="277.5" y="120.3" width="50" height="269.7"/>
    <text class="value" x="120" y="365">6.6</text>
    <text class="value" x="185" y="375">3.1</text>
    <text class="value-inverse" x="302.5" y="139">93.0</text>
    <text class="category" x="120" y="405"><tspan x="120">Go</tspan><tspan x="120" dy="13">current</tspan></text>
    <text class="category" x="185" y="405"><tspan x="185">Rust</tspan><tspan x="185" dy="13">standard</tspan></text>
    <text class="category" x="302.5" y="405"><tspan x="302.5">Rust strong</tspan><tspan x="302.5" dy="13">opt-in only</tspan></text>
  </g>

  <!-- Mixed throughput -->
  <g aria-label="Mixed throughput in operations per second">
    <text class="panel-title" x="600" y="88" text-anchor="middle">Mixed throughput</text>
    <rect x="660" y="100" width="85" height="290" fill="#fdf2f8"/>
    <line class="grid" x1="450" y1="390" x2="750" y2="390"/>
    <line class="grid" x1="450" y1="332" x2="750" y2="332"/>
    <line class="grid" x1="450" y1="274" x2="750" y2="274"/>
    <line class="grid" x1="450" y1="216" x2="750" y2="216"/>
    <line class="grid" x1="450" y1="158" x2="750" y2="158"/>
    <line class="grid" x1="450" y1="100" x2="750" y2="100"/>
    <line class="axis" x1="450" y1="100" x2="450" y2="390"/>
    <line class="axis" x1="450" y1="390" x2="750" y2="390"/>
    <line class="separator" x1="650" y1="100" x2="650" y2="390"/>
    <text class="tick" x="442" y="394" text-anchor="end">0</text>
    <text class="tick" x="442" y="336" text-anchor="end">1,000</text>
    <text class="tick" x="442" y="278" text-anchor="end">2,000</text>
    <text class="tick" x="442" y="220" text-anchor="end">3,000</text>
    <text class="tick" x="442" y="162" text-anchor="end">4,000</text>
    <text class="tick" x="442" y="104" text-anchor="end">5,000</text>
    <text class="axis-label" x="398" y="245" text-anchor="middle" transform="rotate(-90 398 245)">Operations per second</text>
    <text class="option-label" x="702.5" y="112">RUST-ONLY OPTION</text>
    <rect class="go" x="495" y="192.1" width="50" height="197.9"/>
    <rect class="standard" x="560" y="140" width="50" height="250"/>
    <rect class="strong" x="677.5" y="375.3" width="50" height="14.7"/>
    <text class="value" x="520" y="186">3,412</text>
    <text class="value" x="585" y="134">4,311</text>
    <text class="value" x="702.5" y="369">253</text>
    <text class="category" x="520" y="405"><tspan x="520">Go</tspan><tspan x="520" dy="13">current</tspan></text>
    <text class="category" x="585" y="405"><tspan x="585">Rust</tspan><tspan x="585" dy="13">standard</tspan></text>
    <text class="category" x="702.5" y="405"><tspan x="702.5">Rust strong</tspan><tspan x="702.5" dy="13">opt-in only</tspan></text>
  </g>

  <!-- Median write latency -->
  <g aria-label="Median write latency in milliseconds">
    <text class="panel-title" x="1000" y="88" text-anchor="middle">Median write latency</text>
    <rect x="1060" y="100" width="85" height="290" fill="#fdf2f8"/>
    <line class="grid" x1="850" y1="390" x2="1150" y2="390"/>
    <line class="grid" x1="850" y1="332" x2="1150" y2="332"/>
    <line class="grid" x1="850" y1="274" x2="1150" y2="274"/>
    <line class="grid" x1="850" y1="216" x2="1150" y2="216"/>
    <line class="grid" x1="850" y1="158" x2="1150" y2="158"/>
    <line class="grid" x1="850" y1="100" x2="1150" y2="100"/>
    <line class="axis" x1="850" y1="100" x2="850" y2="390"/>
    <line class="axis" x1="850" y1="390" x2="1150" y2="390"/>
    <line class="separator" x1="1050" y1="100" x2="1050" y2="390"/>
    <text class="tick" x="842" y="394" text-anchor="end">0</text>
    <text class="tick" x="842" y="336" text-anchor="end">2</text>
    <text class="tick" x="842" y="278" text-anchor="end">4</text>
    <text class="tick" x="842" y="220" text-anchor="end">6</text>
    <text class="tick" x="842" y="162" text-anchor="end">8</text>
    <text class="tick" x="842" y="104" text-anchor="end">10</text>
    <text class="axis-label" x="816" y="245" text-anchor="middle" transform="rotate(-90 816 245)">Milliseconds</text>
    <text class="option-label" x="1102.5" y="112">RUST-ONLY OPTION</text>
    <rect class="go" x="895" y="379.7" width="50" height="10.3"/>
    <rect class="standard" x="960" y="381.3" width="50" height="8.7"/>
    <rect class="strong" x="1077.5" y="125.3" width="50" height="264.7"/>
    <text class="value" x="920" y="373">0.354</text>
    <text class="value" x="985" y="375">0.301</text>
    <text class="value-inverse" x="1102.5" y="144">9.128</text>
    <text class="category" x="920" y="405"><tspan x="920">Go</tspan><tspan x="920" dy="13">current</tspan></text>
    <text class="category" x="985" y="405"><tspan x="985">Rust</tspan><tspan x="985" dy="13">standard</tspan></text>
    <text class="category" x="1102.5" y="405"><tspan x="1102.5">Rust strong</tspan><tspan x="1102.5" dy="13">opt-in only</tspan></text>
  </g>

  <g aria-label="Legend">
    <rect class="go" x="358" y="444" width="18" height="18" rx="2"/>
    <text class="legend" x="384" y="458">Go current</text>
    <rect class="standard" x="505" y="444" width="18" height="18" rx="2"/>
    <text class="legend" x="531" y="458">Rust standard: like-for-like</text>
    <rect class="strong" x="730" y="444" width="18" height="18" rx="2"/>
    <text class="legend" x="756" y="458">Rust strong: added guarantees</text>
  </g>
  <text class="note" x="600" y="494">Go has no strong mode; separated pink regions show the cost of an additional Rust-only recovery protocol.</text>
</svg>
