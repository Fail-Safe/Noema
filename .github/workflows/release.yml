name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Validate tag and package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$tag_version" = "$package_version"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke-test version output
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = windows ]; then
            target/release/noema.exe version
          else
            target/release/noema version
          fi

      - name: Package Unix archive
        if: matrix.os != 'windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="noema_${version}_${{ matrix.os }}_${{ matrix.arch }}.tar.gz"
          tar -czf "$archive" -C target/release noema -C ../../ LICENSE README.md

      - name: Package Windows archive
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $archive = "noema_${version}_${{ matrix.os }}_${{ matrix.arch }}.zip"
          New-Item -ItemType Directory -Path release-package
          Copy-Item target/release/noema.exe, LICENSE, README.md release-package/
          Compress-Archive -Path release-package/* -DestinationPath $archive

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: noema-${{ matrix.os }}-${{ matrix.arch }}
          path: noema_*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: noema-*
          path: dist
          merge-multiple: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/obsidian/package-lock.json

      - name: Build plugin archives
        shell: bash
        run: |
          tar -czf dist/noema-hermes-plugin.tar.gz \
            -C plugins/hermes __init__.py transport.py plugin.yaml README.md
          npm --prefix plugins/obsidian ci --silent
          npm --prefix plugins/obsidian run build
          git diff --exit-code -- plugins/obsidian/main.js
          mkdir -p .release-obsidian/noema
          cp plugins/obsidian/manifest.json plugins/obsidian/main.js \
            plugins/obsidian/styles.css plugins/obsidian/README.md \
            .release-obsidian/noema/
          tar -czf dist/noema-obsidian-plugin.tar.gz -C .release-obsidian noema

      - name: Generate checksums
        working-directory: dist
        run: sha256sum noema_* > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_flags=()
          case "$GITHUB_REF_NAME" in
            *-*) release_flags+=(--prerelease) ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Noema $GITHUB_REF_NAME" --generate-notes "${release_flags[@]}"
          fi

      - name: Update Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh repo clone Fail-Safe/homebrew-tap .release-homebrew
          python3 scripts/render-homebrew.py \
            --version "$version" --dist dist --tap .release-homebrew
          git -C .release-homebrew config user.name noema-release-bot
          git -C .release-homebrew config user.email bot@users.noreply.github.com
          git -C .release-homebrew add Formula Casks
          if git -C .release-homebrew diff --cached --quiet; then
            exit 0
          fi
          git -C .release-homebrew commit -m "noema: update to $GITHUB_REF_NAME"
          git -C .release-homebrew push origin HEAD:main
