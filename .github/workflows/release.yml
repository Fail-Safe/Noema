name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            target: x86_64-unknown-linux-musl
            suffix: _musl
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
            suffix: _musl
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: windows-2025
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Set up native musl toolchain
        if: matrix.target != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake clang
          rustup target add "${{ matrix.target }}"

      - name: Validate tag and package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$tag_version" = "$package_version"

      - name: Test storage and maintenance
        run: cargo test --locked --test nosync_layout --test database_maintenance

      - name: Build release binary
        env:
          RUSTFLAGS: -D warnings
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            linker_var="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr '[:lower:]-' '[:upper:]_')_LINKER"
            export "$linker_var=musl-gcc"
            CC=musl-gcc cargo build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked
          fi

      - name: Smoke-test version output
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = windows ]; then
            target/release/noema.exe version
          elif [ -n "${{ matrix.target }}" ]; then
            binary="target/${{ matrix.target }}/release/noema"
            "$binary" version
            file "$binary"
            file "$binary" | grep -E 'statically linked|static-pie linked'
            if readelf -l "$binary" | grep -q INTERP; then
              echo "error: musl binary has a dynamic interpreter" >&2
              exit 1
            fi
            if readelf -d "$binary" | grep -q NEEDED; then
              echo "error: musl binary has shared library dependencies" >&2
              exit 1
            fi
          else
            target/release/noema version
          fi

      - name: Package Unix archive
        if: matrix.os != 'windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="noema_${version}_${{ matrix.os }}_${{ matrix.arch }}${{ matrix.suffix }}.tar.gz"
          binary_dir=target/release
          if [ -n "${{ matrix.target }}" ]; then
            binary_dir="target/${{ matrix.target }}/release"
          fi
          mkdir -p release-package
          cp "$binary_dir/noema" LICENSE README.md release-package/
          tar -czf "$archive" -C release-package noema LICENSE README.md

      - name: Package Windows archive
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $archive = "noema_${version}_${{ matrix.os }}_${{ matrix.arch }}.zip"
          New-Item -ItemType Directory -Path release-package
          Copy-Item target/release/noema.exe, LICENSE, README.md release-package/
          Compress-Archive -Path release-package/* -DestinationPath $archive

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: noema-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}
          path: noema_*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: noema-*
          path: dist
          merge-multiple: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/obsidian/package-lock.json

      - name: Build plugin archives
        shell: bash
        run: |
          tar -czf dist/noema-hermes-plugin.tar.gz \
            -C plugins/hermes __init__.py transport.py plugin.yaml README.md
          npm --prefix plugins/obsidian ci --silent
          npm --prefix plugins/obsidian run build
          git diff --exit-code -- plugins/obsidian/main.js
          mkdir -p .release-obsidian/noema
          cp plugins/obsidian/manifest.json plugins/obsidian/main.js \
            plugins/obsidian/styles.css plugins/obsidian/README.md \
            .release-obsidian/noema/
          tar -czf dist/noema-obsidian-plugin.tar.gz -C .release-obsidian noema

      - name: Stage installer asset
        run: cp install.sh dist/install.sh

      - name: Generate checksums
        working-directory: dist
        run: sha256sum noema_* install.sh > checksums.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_flags=()
          case "$GITHUB_REF_NAME" in
            *-*) release_flags+=(--prerelease) ;;
          esac
          notes_flags=(--generate-notes)
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            notes_flags=(--notes-file "docs/releases/$GITHUB_REF_NAME.md")
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Noema $GITHUB_REF_NAME" "${notes_flags[@]}" "${release_flags[@]}"
          fi

      - name: Notify website of stable release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.NOEMA_WEB_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::NOEMA_WEB_DISPATCH_TOKEN is empty; skipping website dispatch"
            exit 0
          fi
          gh api --method POST repos/Fail-Safe/Noema-web/dispatches \
            -f event_type=noema-release -f "client_payload[tag]=$GITHUB_REF_NAME"

      - name: Update Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != '' && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh auth setup-git --hostname github.com
          gh repo clone Fail-Safe/homebrew-tap .release-homebrew
          python3 scripts/render-homebrew.py \
            --version "$version" --dist dist --tap .release-homebrew
          git -C .release-homebrew config user.name noema-release-bot
          git -C .release-homebrew config user.email bot@users.noreply.github.com
          git -C .release-homebrew add Formula Casks
          if git -C .release-homebrew diff --cached --quiet; then
            exit 0
          fi
          git -C .release-homebrew commit -m "noema: update to $GITHUB_REF_NAME"
          git -C .release-homebrew push origin HEAD:main
