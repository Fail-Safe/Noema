name: ci

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust build + lint + test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
          rustup default 1.88.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Verify formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke-test version output
        run: target/release/noema version

  plugins-and-scripts:
    name: Plugins + repository scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: plugin-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: plugin-rust-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: plugins/hermes/requirements-dev.txt

      - name: Test Hermes plugin
        run: |
          python -m pip install --requirement plugins/hermes/requirements-dev.txt
          python -m pytest -q plugins/hermes

      - name: Test release metadata generator
        run: python -m unittest tests/render_homebrew_test.py

      - name: Test repository scripts
        run: bash tests/sync-brand-assets_test.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/obsidian/package-lock.json

      - name: Build Obsidian plugin
        working-directory: plugins/obsidian
        run: |
          npm ci --silent
          npm test
          npm run build
          npx tsc --noEmit
          git diff --exit-code -- main.js
